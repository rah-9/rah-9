<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1f44"/><stop offset="1" stop-color="#1e4b8f"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#f2c14e"/><stop offset="1" stop-color="#ffe29a"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
<clipPath id="c"><rect width="1200" height="300" rx="14"/></clipPath>
</defs>
<style>
.nm{font-family:Georgia,'Times New Roman',serif;font-size:70px;font-weight:700;fill:#fff;letter-spacing:3px}
.rl{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:19px;font-weight:600;letter-spacing:6px;fill:#f2c14e}
.tg{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:22px;fill:#dbe7ff}
.ul{stroke-dasharray:300;stroke-dashoffset:300;animation:d 1.8s ease-out .3s forwards}
@keyframes d{to{stroke-dashoffset:0}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="300" fill="url(#bg)"/><rect width="1200" height="300" fill="url(#grid)"/>
<circle cx="1120" cy="40" r="170" fill="#ffffff" fill-opacity=".05"/><circle cx="90" cy="290" r="140" fill="#f2c14e" fill-opacity=".08"/>
<rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>
<text x="600" y="100" text-anchor="middle" class="rl">AI ENGINEER  |  SOFTWARE ENGINEER</text>
<text x="600" y="182" text-anchor="middle" class="nm">Tarachand Rahul</text>
<line class="ul" x1="450" y1="204" x2="750" y2="204" stroke="#f2c14e" stroke-width="3" stroke-linecap="round"/>
<text x="600" y="252" text-anchor="middle" class="tg">Building intelligent systems, from the model to production</text>
</g></svg>
