<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
<style>
.k{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:13px;letter-spacing:3px;font-weight:700}
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;fill:#f1f5f9}
.d{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;fill:#94a3b8}
.cd{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style><g class="cd" style="animation-delay:0.0s">
<rect x="12" y="14" width="273" height="222" rx="18" fill="#0d1428" stroke="#22d3ee" stroke-opacity=".45"/>
<rect x="12" y="14" width="273" height="5" rx="2.5" fill="#22d3ee" opacity=".9"/>
<circle cx="48" cy="62" r="16" fill="#22d3ee" opacity=".15"/><circle cx="48" cy="62" r="6" fill="#22d3ee"><animate attributeName="r" values="5;9;5" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle>
<text x="74" y="67" class="k" fill="#22d3ee">AGENTS</text>
<text x="34" y="112" class="t">LLM agents, workflows</text>
<text x="34" y="148" class="d">Tool calling, structured</text><text x="34" y="169" class="d">outputs, planner and executor</text><text x="34" y="190" class="d">design, retries and fallbacks.</text>
</g><g class="cd" style="animation-delay:0.6s">
<rect x="309" y="14" width="273" height="222" rx="18" fill="#0d1428" stroke="#a78bfa" stroke-opacity=".45"/>
<rect x="309" y="14" width="273" height="5" rx="2.5" fill="#a78bfa" opacity=".9"/>
<circle cx="345" cy="62" r="16" fill="#a78bfa" opacity=".15"/><circle cx="345" cy="62" r="6" fill="#a78bfa"><animate attributeName="r" values="5;9;5" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
<text x="371" y="67" class="k" fill="#a78bfa">RETRIEVAL</text>
<text x="331" y="112" class="t">RAG and semantic search</text>
<text x="331" y="148" class="d">Embeddings, FAISS,</text><text x="331" y="169" class="d">SentenceTransformers,</text><text x="331" y="190" class="d">contextual question answering.</text>
</g><g class="cd" style="animation-delay:1.2s">
<rect x="606" y="14" width="273" height="222" rx="18" fill="#0d1428" stroke="#f472b6" stroke-opacity=".45"/>
<rect x="606" y="14" width="273" height="5" rx="2.5" fill="#f472b6" opacity=".9"/>
<circle cx="642" cy="62" r="16" fill="#f472b6" opacity=".15"/><circle cx="642" cy="62" r="6" fill="#f472b6"><animate attributeName="r" values="5;9;5" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle>
<text x="668" y="67" class="k" fill="#f472b6">MULTIMODAL</text>
<text x="628" y="112" class="t">Speech and vision</text>
<text x="628" y="148" class="d">Faster-Whisper, vision-</text><text x="628" y="169" class="d">language models, spaCy,</text><text x="628" y="190" class="d">Transformers, document</text><text x="628" y="211" class="d">extraction.</text>
</g><g class="cd" style="animation-delay:1.7999999999999998s">
<rect x="903" y="14" width="273" height="222" rx="18" fill="#0d1428" stroke="#34d399" stroke-opacity=".45"/>
<rect x="903" y="14" width="273" height="5" rx="2.5" fill="#34d399" opacity=".9"/>
<circle cx="939" cy="62" r="16" fill="#34d399" opacity=".15"/><circle cx="939" cy="62" r="6" fill="#34d399"><animate attributeName="r" values="5;9;5" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
<text x="965" y="67" class="k" fill="#34d399">PRODUCTION</text>
<text x="925" y="112" class="t">Backend and cloud</text>
<text x="925" y="148" class="d">Async FastAPI, PostgreSQL,</text><text x="925" y="169" class="d">auth and RBAC, Docker, GitHub</text><text x="925" y="190" class="d">Actions, GCP and Azure.</text>
</g></svg>