<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e4efff"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#2a6fd1"/><stop offset="1" stop-color="#7ec0ff"/></linearGradient>
<clipPath id="c"><rect width="1200" height="380" rx="18"/></clipPath></defs>
<style>.a{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:700;fill:#0b2a5b}.b{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;fill:#44546e}
.nn{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:#9ed0ff}.h{font-family:Georgia,'Times New Roman',serif;font-size:36px;font-style:italic;fill:#0b2a5b}
.it{animation:up 5s ease-in-out infinite}@keyframes up{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}</style>
<g clip-path="url(#c)"><rect width="1200" height="380" fill="url(#p)"/><rect width="1200" height="8" fill="url(#gold)"/></g>
<rect x="1.5" y="1.5" width="1197" height="377" rx="17" fill="none" stroke="#2b6fd6" stroke-opacity=".6" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" class="h">What I do</text>
<line x1="540" y1="82" x2="660" y2="82" stroke="#2b6fd6" stroke-width="3" stroke-linecap="round"/>
<g class="it" style="animation-delay:0.0s"><circle cx="84" cy="124" r="14" fill="#0b2a5b"/><text x="84" y="129" text-anchor="middle" class="nn">1</text><text x="112" y="122" class="a">LLM agents and workflows</text><text x="112" y="144" class="b">Tool calling, structured outputs, safe fallbacks</text></g><g class="it" style="animation-delay:0.15s"><circle cx="664" cy="124" r="14" fill="#0b2a5b"/><text x="664" y="129" text-anchor="middle" class="nn">2</text><text x="692" y="122" class="a">Retrieval systems</text><text x="692" y="144" class="b">Embeddings, vector search and RAG</text></g><g class="it" style="animation-delay:0.3s"><circle cx="84" cy="186" r="14" fill="#0b2a5b"/><text x="84" y="191" text-anchor="middle" class="nn">3</text><text x="112" y="184" class="a">Speech, vision and documents</text><text x="112" y="206" class="b">Multimodal models that turn raw media into data</text></g><g class="it" style="animation-delay:0.44999999999999996s"><circle cx="664" cy="186" r="14" fill="#0b2a5b"/><text x="664" y="191" text-anchor="middle" class="nn">4</text><text x="692" y="184" class="a">Backend services</text><text x="692" y="206" class="b">Async REST APIs with FastAPI and PostgreSQL</text></g><g class="it" style="animation-delay:0.6s"><circle cx="84" cy="248" r="14" fill="#0b2a5b"/><text x="84" y="253" text-anchor="middle" class="nn">5</text><text x="112" y="246" class="a">Web interfaces</text><text x="112" y="268" class="b">React, TypeScript and Next.js</text></g><g class="it" style="animation-delay:0.75s"><circle cx="664" cy="248" r="14" fill="#0b2a5b"/><text x="664" y="253" text-anchor="middle" class="nn">6</text><text x="692" y="246" class="a">Deployment</text><text x="692" y="268" class="b">Docker and CI/CD on GCP and Azure</text></g><g class="it" style="animation-delay:0.8999999999999999s"><circle cx="84" cy="310" r="14" fill="#0b2a5b"/><text x="84" y="315" text-anchor="middle" class="nn">7</text><text x="112" y="308" class="a">Evaluation and reliability</text><text x="112" y="330" class="b">Quality, latency, cost, monitoring, root-cause debugging</text></g><g class="it" style="animation-delay:1.05s"><circle cx="664" cy="310" r="14" fill="#0b2a5b"/><text x="664" y="315" text-anchor="middle" class="nn">8</text><text x="692" y="308" class="a">Applied machine learning</text><text x="692" y="330" class="b">Classification, anomaly detection, explainability</text></g></svg>