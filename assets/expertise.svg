<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
<defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e4efff"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#2a6fd1"/><stop offset="1" stop-color="#7ec0ff"/></linearGradient>
<clipPath id="c"><rect width="1200" height="460" rx="18"/></clipPath></defs>
<style>.a{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:700;fill:#0b2a5b}.b{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;fill:#44546e}
.nn{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;fill:#9ed0ff}.h{font-family:Georgia,'Times New Roman',serif;font-size:38px;font-style:italic;fill:#0b2a5b}
.it{animation:up 5s ease-in-out infinite}@keyframes up{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}</style>
<g clip-path="url(#c)"><rect width="1200" height="460" fill="url(#p)"/><rect width="1200" height="8" fill="url(#gold)"/></g>
<rect x="1.5" y="1.5" width="1197" height="457" rx="17" fill="none" stroke="#2b6fd6" stroke-opacity=".6" stroke-width="1.5"/>
<text x="600" y="68" text-anchor="middle" class="h">What I do</text>
<line x1="540" y1="90" x2="660" y2="90" stroke="#2b6fd6" stroke-width="3" stroke-linecap="round"/>
<g class="it" style="animation-delay:0.0s"><circle cx="86" cy="144" r="13" fill="#0b2a5b"/><text x="86" y="148.5" text-anchor="middle" class="nn">1</text><text x="120" y="150" class="a">LLM agents and workflows</text><text x="470" y="149" class="b">Tool calling, structured outputs, safe fallbacks</text><line x1="70" y1="165" x2="1130" y2="165" stroke="#2b6fd6" stroke-opacity=".18"/></g><g class="it" style="animation-delay:0.12s"><circle cx="86" cy="182" r="13" fill="#0b2a5b"/><text x="86" y="186.5" text-anchor="middle" class="nn">2</text><text x="120" y="188" class="a">Retrieval systems</text><text x="470" y="187" class="b">Embeddings, vector search and RAG</text><line x1="70" y1="203" x2="1130" y2="203" stroke="#2b6fd6" stroke-opacity=".18"/></g><g class="it" style="animation-delay:0.24s"><circle cx="86" cy="220" r="13" fill="#0b2a5b"/><text x="86" y="224.5" text-anchor="middle" class="nn">3</text><text x="120" y="226" class="a">Speech, vision and documents</text><text x="470" y="225" class="b">Multimodal models that turn raw media into data</text><line x1="70" y1="241" x2="1130" y2="241" stroke="#2b6fd6" stroke-opacity=".18"/></g><g class="it" style="animation-delay:0.36s"><circle cx="86" cy="258" r="13" fill="#0b2a5b"/><text x="86" y="262.5" text-anchor="middle" class="nn">4</text><text x="120" y="264" class="a">Backend services</text><text x="470" y="263" class="b">Async REST APIs with FastAPI and PostgreSQL</text><line x1="70" y1="279" x2="1130" y2="279" stroke="#2b6fd6" stroke-opacity=".18"/></g><g class="it" style="animation-delay:0.48s"><circle cx="86" cy="296" r="13" fill="#0b2a5b"/><text x="86" y="300.5" text-anchor="middle" class="nn">5</text><text x="120" y="302" class="a">Web interfaces</text><text x="470" y="301" class="b">React, TypeScript and Next.js</text><line x1="70" y1="317" x2="1130" y2="317" stroke="#2b6fd6" stroke-opacity=".18"/></g><g class="it" style="animation-delay:0.6s"><circle cx="86" cy="334" r="13" fill="#0b2a5b"/><text x="86" y="338.5" text-anchor="middle" class="nn">6</text><text x="120" y="340" class="a">Deployment</text><text x="470" y="339" class="b">Docker and CI/CD on GCP and Azure</text><line x1="70" y1="355" x2="1130" y2="355" stroke="#2b6fd6" stroke-opacity=".18"/></g><g class="it" style="animation-delay:0.72s"><circle cx="86" cy="372" r="13" fill="#0b2a5b"/><text x="86" y="376.5" text-anchor="middle" class="nn">7</text><text x="120" y="378" class="a">Evaluation and reliability</text><text x="470" y="377" class="b">Quality, latency, cost, monitoring, root-cause debugging</text><line x1="70" y1="393" x2="1130" y2="393" stroke="#2b6fd6" stroke-opacity=".18"/></g><g class="it" style="animation-delay:0.84s"><circle cx="86" cy="410" r="13" fill="#0b2a5b"/><text x="86" y="414.5" text-anchor="middle" class="nn">8</text><text x="120" y="416" class="a">Applied machine learning</text><text x="470" y="415" class="b">Classification, anomaly detection, explainability</text></g></svg>