<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8ef"/><stop offset="1" stop-color="#f1ead7"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e8b53c"/><stop offset="1" stop-color="#ffe3a0"/></linearGradient></defs>
<style>.ct{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;letter-spacing:5px;fill:#0a1f44}
.a{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:700;fill:#0a1f44}.b{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;fill:#4b5a73}
.nn{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:#f2c14e}.h{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-style:italic;fill:#0a1f44}
.it{animation:up 5s ease-in-out infinite}@keyframes up{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}</style>
<rect x="2" y="2" width="1196" height="466" rx="18" fill="url(#p)" stroke="#c8932a" stroke-opacity=".7" stroke-width="1.5"/>
<rect x="2" y="2" width="1196" height="8" rx="4" fill="url(#gold)"/>
<text x="600" y="52" text-anchor="middle" class="h">What I do</text>
<text x="70" y="92" class="ct">AI ENGINEERING</text><line x1="70" y1="108" x2="140" y2="108" stroke="#c8932a" stroke-width="3" stroke-linecap="round"/><g class="it" style="animation-delay:0.0s"><circle cx="84" cy="150" r="14" fill="#0a1f44"/><text x="84" y="155" text-anchor="middle" class="nn">1</text><text x="112" y="148" class="a">LLM agents and workflows</text><text x="112" y="170" class="b">Tool calling, structured outputs, safe fallbacks</text></g><g class="it" style="animation-delay:0.15s"><circle cx="84" cy="210" r="14" fill="#0a1f44"/><text x="84" y="215" text-anchor="middle" class="nn">2</text><text x="112" y="208" class="a">Retrieval systems</text><text x="112" y="230" class="b">Embeddings, vector search and RAG</text></g><g class="it" style="animation-delay:0.3s"><circle cx="84" cy="270" r="14" fill="#0a1f44"/><text x="84" y="275" text-anchor="middle" class="nn">3</text><text x="112" y="268" class="a">Speech, vision and documents</text><text x="112" y="290" class="b">Multimodal models that turn raw media into data</text></g><g class="it" style="animation-delay:0.44999999999999996s"><circle cx="84" cy="330" r="14" fill="#0a1f44"/><text x="84" y="335" text-anchor="middle" class="nn">4</text><text x="112" y="328" class="a">Evaluation</text><text x="112" y="350" class="b">Output quality, latency, cost and failure analysis</text></g><g class="it" style="animation-delay:0.6s"><circle cx="84" cy="390" r="14" fill="#0a1f44"/><text x="84" y="395" text-anchor="middle" class="nn">5</text><text x="112" y="388" class="a">Applied machine learning</text><text x="112" y="410" class="b">Classification, anomaly detection, explainability</text></g>
<line x1="600" y1="80" x2="600" y2="440" stroke="#c8932a" stroke-opacity=".5" stroke-dasharray="2 8" stroke-linecap="round" stroke-width="2"/>
<text x="650" y="92" class="ct">SOFTWARE ENGINEERING</text><line x1="650" y1="108" x2="720" y2="108" stroke="#c8932a" stroke-width="3" stroke-linecap="round"/><g class="it" style="animation-delay:0.0s"><circle cx="664" cy="150" r="14" fill="#0a1f44"/><text x="664" y="155" text-anchor="middle" class="nn">1</text><text x="692" y="148" class="a">Backend services</text><text x="692" y="170" class="b">Async REST APIs in Python and FastAPI</text></g><g class="it" style="animation-delay:0.15s"><circle cx="664" cy="210" r="14" fill="#0a1f44"/><text x="664" y="215" text-anchor="middle" class="nn">2</text><text x="692" y="208" class="a">Data and security</text><text x="692" y="230" class="b">PostgreSQL, authentication, role-based access</text></g><g class="it" style="animation-delay:0.3s"><circle cx="664" cy="270" r="14" fill="#0a1f44"/><text x="664" y="275" text-anchor="middle" class="nn">3</text><text x="692" y="268" class="a">Web interfaces</text><text x="692" y="290" class="b">React, TypeScript and Next.js</text></g><g class="it" style="animation-delay:0.44999999999999996s"><circle cx="664" cy="330" r="14" fill="#0a1f44"/><text x="664" y="335" text-anchor="middle" class="nn">4</text><text x="692" y="328" class="a">Deployment</text><text x="692" y="350" class="b">Docker and CI/CD on GCP and Azure</text></g><g class="it" style="animation-delay:0.6s"><circle cx="664" cy="390" r="14" fill="#0a1f44"/><text x="664" y="395" text-anchor="middle" class="nn">5</text><text x="692" y="388" class="a">Reliability</text><text x="692" y="410" class="b">Monitoring and root-cause debugging of live systems</text></g>
</svg>